global
    log stdout format raw local0
    stats socket ipv4@127.0.0.1:9999 level admin
    presetenv LLM_API_KEY none

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 620s
    timeout server 620s
    retries 2
    option redispatch
    retry-on conn-failure empty-response response-timeout

frontend llm
    bind :8081
    default_backend vllm

backend vllm
    option httpchk
    http-check send meth GET uri /v1/models hdr Authorization "Bearer ${LLM_API_KEY}"
    http-check expect status 200
    default-server inter 2s fall 2 rise 2
    server primary "${LLM_PRIMARY}" check
    server backup "${LLM_BACKUP}" check backup

listen stats
    bind :8404
    stats enable
    stats uri /
    stats refresh 2s
