[project]
name = "decomposer"
version = "0.1.0"
description = "Агент-декомпозитор: эпик → требования → истории → задачи"
authors = [
    { name = "krimax409", email = "krimax409@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.7",
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.50.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
